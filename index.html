<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CMPOS | Chester Media Project</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&family=JetBrains+Mono&display=swap"
        rel="stylesheet">
    <style>
        :root {
            --bg: #050505;
            --gold: #FFD400;
            --glass: rgba(255, 255, 255, 0.05);
        }

        body {
            background: var(--bg);
            color: white;
            font-family: 'Inter', sans-serif;
            margin: 0;
            padding: 2rem;
        }

        .glass-card {
            background: var(--glass);
            border: 1px solid rgba(255, 255, 255, 0.1);
            padding: 1.5rem;
            border-radius: 8px;
        }

        .btn {
            background: var(--gold);
            color: black;
            padding: 0.5rem 1rem;
            text-decoration: none;
            display: inline-block;
            font-weight: bold;
            border-radius: 4px;
            cursor: pointer;
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 1.5rem;
            margin-top: 2rem;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 3rem;
        }

        h1 {
            font-weight: 900;
            letter-spacing: -1px;
        }
    </style>
</head>

<body>

    <header>
        <h1>CMPOS <span style="color:var(--gold)">LIVE</span></h1>
        <button id="btn-login" class="btn">OS LOGIN</button>
    </header>

    <main>
        <h2>Latest Broadcasts</h2>
        <div id="featured-shows" class="grid">
            <!-- Populated by youtube.js -->
            <div class="glass-card">Loading Stream...</div>
        </div>
    </main>

    <script type="module" src="./js/app.js"></script>

</body>

</html>
